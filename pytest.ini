[pytest]
# Main pytest configuration - includes ALL unit tests (requires database for some)
norecursedirs = lib/python3.12/site-packages tests/integration
testpaths = app scripts
pythonpath = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    destructive_migration: downgrades and re-upgrades the shared database; always collected last
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings