name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Never `pull_request`: code from a fork must not run on the production host.
    runs-on: [self-hosted, production]
    environment: production

    env:
      # Absolute: the runner checks out into its own workspace, so the
      # `../environment/...` used by hand does not resolve here.
      ENV_FILE_PATH: ${{ vars.ENVIRONMENT_DIR || '/home/datamap/environment' }}/gatekeeper.prod.env
      # Must match the project the running containers belong to, or `down`
      # leaves them up and `up` collides on the container names.
      COMPOSE_PROJECT_NAME: gatekeeper

    steps:
      - uses: actions/checkout@v4

      - name: Show what is being deployed
        run: git log --oneline -1

      - name: Build the image
        run: make ENV_FILE_PATH=$ENV_FILE_PATH docker-build

      - name: Restart the stack
        run: make ENV_FILE_PATH=$ENV_FILE_PATH docker-deployment-no-prune

      # The application runs `alembic upgrade head` at startup, so a failed
      # migration means the container never becomes healthy and this fails.
      - name: Wait for the API to answer
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:9092/api/v1/health-check/ || true)
            if [ "$code" = "200" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "The API did not answer within five minutes."
          docker logs --tail 100 datamap_gatekeeper
          exit 1

      - name: Confirm the schema is at head
        run: docker exec datamap_gatekeeper python3 -m alembic current

      - name: Container status
        if: always()
        run: docker ps --filter "name=datamap_" --format "table {{.Names}}\t{{.Status}}"

      - name: Logs on failure
        if: failure()
        run: docker logs --tail 200 datamap_gatekeeper

      - name: Reclaim disk
        if: success()
        run: docker image prune -f
