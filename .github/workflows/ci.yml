name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it carries the deploy, and interrupting that
  # leaves the stack down.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.10.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The pinned version, not the latest: a gate that lints with a different
      # version than the developer is not reproducible and breaks on release day.
      - name: Install ruff
        run: pip install "$(grep -i '^ruff==' requirements.txt)"

      - run: ruff check .

      - run: ruff format --check .

      # A workflow is only validated when GitHub parses it, which is after the
      # merge - an invalid one takes the deploy down and no check notices.
      # `runner.temp` in a job's env block got through review, CI and a merge
      # that way, and actionlint reports it exactly.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color

      # The alert rules are code with no other test: a rule that never fires
      # looks exactly like a system that never fails.
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/infrastructure/prometheus:/etc/prometheus" \
            -w /etc/prometheus --entrypoint promtool prom/prometheus:v2.53.0 \
            check config prometheus.yml
          docker run --rm -v "$PWD/infrastructure/prometheus:/etc/prometheus" \
            -w /etc/prometheus --entrypoint promtool prom/prometheus:v2.53.0 \
            test rules alerts_test.yml

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # app/config.py reads `${ENVIRONMENT}.env` at import time, so without a
      # file the suite fails during collection rather than in a test.
      - name: Create the configuration the suite imports
        run: cp local.env.template local.env

      # Not `pytest app`: an explicit path overrides testpaths, and the
      # scripts/ tests would silently never run.
      - name: Run unit tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The compose file bind-mounts ${STORAGE_DOCKER_VOLUME}_test_integration,
      # a path relative to the repository in local development. The `datamap`
      # directory is the bucket: MinIO does not create it, and the snapshot
      # tests only pass locally because a developer's storage already has it.
      - name: Prepare the object storage bind mount
        run: mkdir -p "${{ runner.temp }}/data-storage_test_integration/datamap"

      - uses: docker/setup-buildx-action@v3

      # Compose only builds an image it cannot find, so `up` starts from this
      # one, whose compiled dependencies come from the Actions cache.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gatekeeper
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services
        run: |
          make ENV_FILE_PATH=integration-test.env \
               STORAGE_DOCKER_VOLUME="${{ runner.temp }}/data-storage" \
               integration-test-up

      # A healthcheck that never passes is worse than none: it reports a broken
      # system as fine. The postgres one was interpolating from the invoking
      # shell and had been failing silently.
      - name: Every container must report healthy
        run: |
          for _ in $(seq 1 40); do
            status=$(docker ps --format "{{.Names}} {{.Status}}" | grep test_integration)
            if ! echo "$status" | grep -qv "(healthy)"; then
              echo "$status"
              exit 0
            fi
            sleep 5
          done
          echo "not every container became healthy:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          exit 1

      - name: Seed test data
        run: |
          docker exec datamap_postgres_test_integration \
            psql -U gk_admin -d gatekeeper_db -f /tmp/seed_clients.sql

      # Casbin reloads its policy every 5 seconds, so the rows just seeded are
      # not in memory yet and the first requests come back 401.
      - name: Wait for the seeded policy to load
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-Api-Key: 5060b1a2-9aaf-48db-871a-0839007fd478" \
              -H "X-Api-Secret: integration-test-not-a-real-secret" \
              -H "X-User-Id: cbb0a683-630f-4b86-8b45-91b90a6fce1c" \
              http://localhost:9094/api/v1/clients/)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "The seeded Casbin policy never became effective."
          exit 1

      - name: Run integration tests
        run: pytest tests/integration -q --durations=15

      # Also as a file: re-running a failed job replaces its log.
      - name: Service logs
        if: failure()
        run: |
          make ENV_FILE_PATH=integration-test.env integration-test-logs \
            | tee "${{ runner.temp }}/integration-logs.txt"

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-logs.txt
          retention-days: 14

      - name: Stop services
        if: always()
        run: |
          make ENV_FILE_PATH=integration-test.env \
               STORAGE_DOCKER_VOLUME="${{ runner.temp }}/data-storage" \
               integration-test-down

  deploy:
    # Why this job lives here rather than in its own workflow: two workflows on
    # the same push run in parallel, so the deploy raced the tests and regularly
    # finished first. `needs` only reaches jobs in the same workflow.
    needs: [lint, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Never `pull_request`: code from a fork must not run on the production host.
    runs-on: [self-hosted, production]
    environment: production

    # Serialise deploys without ever cancelling one in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # ENV_FILE_PATH is deliberately not set here: it names the decrypted copy,
      # and `runner.temp` does not exist in a job's env context - only inside a
      # step. The decrypt step exports it, so a step that ran before it would
      # fail on an empty path rather than quietly use some other file.
      #
      # Must match the project the running containers belong to, or `down`
      # leaves them up and `up` collides on the container names.
      COMPOSE_PROJECT_NAME: gatekeeper

    steps:
      - uses: actions/checkout@v4

      - name: Show what is being deployed
        run: git log --oneline -1

      - name: Install the pinned sops
        run: bash scripts/install_sops.sh

      # Every file, not only the gatekeeper's: the guard below compares against
      # all of them, so decrypting one would quietly stop checking the other
      # services' credentials.
      #
      # umask first, not chmod after: the files carry every production
      # credential, and creating them readable leaves a window.
      - name: Decrypt the environment
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/env"
          for file in secrets/production/*.env; do
            "$HOME/bin/sops" --decrypt "$file" > "$RUNNER_TEMP/env/$(basename "$file")"
          done
          ls -l "$RUNNER_TEMP/env"
          echo "ENV_FILE_PATH=$RUNNER_TEMP/env/gatekeeper.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY_FILE: /home/datamap/.config/sops/age/keys.txt

      # This repository is public, and these values are what must never appear in
      # it. Reading them from the decrypted copies rather than from a plaintext
      # file on the host is what let that file be retired.
      - name: No production credential may be tracked
        run: python3 scripts/check_tracked_secrets.py "$RUNNER_TEMP/env"

      - name: Build the image
        run: make ENV_FILE_PATH="$ENV_FILE_PATH" docker-build

      # `docker compose down` deletes each container along with its log file, so
      # without this every deploy erases the evidence of whatever it is fixing.
      - name: Archive the logs of the containers about to be replaced
        run: |
          dir="${{ vars.LOG_ARCHIVE_DIR || '/home/datamap/logs' }}"
          mkdir -p "$dir"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          for c in datamap_gatekeeper datamap_gatekeeper_b datamap_tusd datamap_min_io datamap_gatekeeper_db; do
            docker inspect "$c" >/dev/null 2>&1 || continue
            docker logs -t "$c" 2>&1 | gzip > "$dir/$c-$stamp.log.gz"
          done
          find "$dir" -name '*.log.gz' -mtime +30 -delete
          du -sh "$dir"

      # One instance at a time, so nginx always has one to send to. The
      # application runs `alembic upgrade head` at startup and the advisory lock
      # serialises that; a failed migration means the instance never becomes
      # healthy, `--wait` never returns, and this step fails.
      - name: Roll the instances
        run: make ENV_FILE_PATH="$ENV_FILE_PATH" docker-deployment-rolling

      - name: Both instances must answer
        run: |
          for port in 9092 9192; do
            ok=""
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:$port/api/v1/health-check/ || true)
              if [ "$code" = "200" ]; then
                ok="yes"
                break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "the instance on $port did not answer within five minutes."
              docker logs --tail 100 datamap_gatekeeper
              docker logs --tail 100 datamap_gatekeeper_b
              exit 1
            fi
            echo "$port healthy"
          done

      - name: Confirm the schema is at head
        run: docker exec datamap_gatekeeper python3 -m alembic current

      # The backup timer runs outside Docker, at 03:20, with nobody watching.
      # Running it from this workspace would make it depend on a directory CI
      # owns; the --help is here so a broken import fails now and not then.
      - name: Install the scripts the backup timer runs
        run: |
          install -D -m 644 scripts/__init__.py /home/datamap/bin/scripts/__init__.py
          install -D -m 644 scripts/backup_database.py /home/datamap/bin/scripts/backup_database.py
          install -D -m 644 scripts/backup_metrics.py /home/datamap/bin/scripts/backup_metrics.py
          rm -f /home/datamap/bin/backup_database.py
          PYTHONPATH=/home/datamap/bin /usr/bin/python3 -m scripts.backup_database --help > /dev/null
          echo "installed and importable"

      - name: Container status
        if: always()
        run: docker ps --filter "name=datamap_" --format "table {{.Names}}\t{{.Status}}"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs --tail 200 datamap_gatekeeper
          docker logs --tail 200 datamap_gatekeeper_b

      # Always, including after a failure: the runner's temp directory outlives
      # a failed job long enough to matter, and this file is every credential.
      - name: Remove the decrypted environment
        if: always()
        run: rm -rf "$RUNNER_TEMP/env"

      - name: Reclaim disk
        if: success()
        run: docker image prune -f
