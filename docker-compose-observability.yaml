x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: datamap_prometheus
    restart: always
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # Not published: reached through Grafana, on the docker network.
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gatekeeper_gatekeeper-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: datamap_grafana
    restart: always
    logging: *logging
    env_file:
      - ${ENV_FILE_PATH}
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gatekeeper_gatekeeper-network

  loki:
    image: grafana/loki:3.7.8
    container_name: datamap_loki
    restart: always
    logging: *logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    # No healthcheck: the image is distroless, with no shell and no http client
    # to run one with. Prometheus scrapes it instead, and TargetDown alerts.
    networks:
      - gatekeeper_gatekeeper-network

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: datamap_alloy
    restart: always
    logging: *logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Reading other containers' logs means talking to the daemon. See
      # docs/runbooks/observability.md for what that grants.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    # No healthcheck, for the same reason as Loki: the image carries a shell but
    # no http client to probe with, so the check could only ever fail. It ran
    # for a day reporting unhealthy while Prometheus scraped it successfully.
    # That scrape is the signal, and TargetDown is the alert.
    networks:
      - gatekeeper_gatekeeper-network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  gatekeeper_gatekeeper-network:
    external: true
    name: gatekeeper_gatekeeper-network
