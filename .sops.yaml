# Which key encrypts what. `sops` reads this from the repository root, so
# encrypting a file needs no flags and cannot be done with the wrong recipient
# by accident.
#
# The private key lives at ~/.config/sops/age/keys.txt on the production host
# and on each maintainer's machine. Losing every copy means re-issuing every
# credential in here by hand: see docs/runbooks/secrets.md.
creation_rules:
  - path_regex: secrets/production/.*\.env$
    input_type: dotenv
    output_type: dotenv
    age: age1mjnhlj26qm97tzvn4dm9k47582jydjmsmhnsgpgswqjl4vt9zacs2knu99
