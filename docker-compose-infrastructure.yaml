version: '3'

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  gatekeeper:
    build: .
    image: gatekeeper
    container_name: datamap_gatekeeper
    restart: always
    logging: *logging
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9092/api/v1/health-check/",
        ]
      # start_interval polls every second until the first success, so a rolling
      # deploy waits about two seconds per instance instead of six. interval is
      # what it costs afterwards, when nothing is starting.
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - ${ENV_FILE_PATH}
    environment:
      - POSTGRES_HOST=datamap_gatekeeper_db
    ports: 
      - '9092:9092'
    depends_on:
      - gatekeeper-db
    networks:
      gatekeeper_gatekeeper-network:
        # Shared with the second instance, so anything inside the network that
        # asks for `gatekeeper` reaches whichever is up. TUSd's hook URL is the
        # one that matters.
        aliases:
          - gatekeeper

  gatekeeper_b:
    image: gatekeeper
    container_name: datamap_gatekeeper_b
    restart: always
    logging: *logging
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9092/api/v1/health-check/",
        ]
      # start_interval polls every second until the first success, so a rolling
      # deploy waits about two seconds per instance instead of six. interval is
      # what it costs afterwards, when nothing is starting.
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - ${ENV_FILE_PATH}
    environment:
      - POSTGRES_HOST=datamap_gatekeeper_db
    ports:
      - '9192:9092'
    depends_on:
      - gatekeeper-db
    networks:
      gatekeeper_gatekeeper-network:
        aliases:
          - gatekeeper

  minio:
    image: ghcr.io/ardc-brazil/minio:RELEASE.2024-03-21T23-13-43Z@sha256:9aa076e72064fb3c49ee954a028c7b9608b5c2f852b951992f6d328514a2010d
    command: server /storage --console-address ":9001"
    container_name: datamap_min_io
    restart: always
    logging: *logging
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ${ENV_FILE_PATH}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - gatekeeper_gatekeeper-network
    hostname: minio
    volumes:
      - storage:/storage/
  
  tusd:
    image: tusproject/tusd:v2.4
    container_name: datamap_tusd
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "1080:1080"
    env_file:
      - ${ENV_FILE_PATH}
    entrypoint: /bin/sh -c
    command: ["tusd -port 1080 -s3-bucket datamap -s3-object-prefix staged/ -s3-endpoint $${TUS_S3_ENDPOINT} -hooks-http $${TUS_HOOK_API} -cors-allow-headers X-User-Token,X-User-Id"]
    depends_on:
      - minio
    networks:
      - gatekeeper_gatekeeper-network

volumes:
  storage:
    driver: local
    driver_opts:
      device: ${STORAGE_DOCKER_VOLUME}
      o: bind
      type: local

networks:
  gatekeeper_gatekeeper-network:
    driver: bridge
    name: gatekeeper_gatekeeper-network
