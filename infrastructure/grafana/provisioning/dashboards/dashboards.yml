apiVersion: 1

providers:
  - name: datamap
    orgId: 1
    type: file
    disableDeletion: true
    # The repository is the only place a dashboard changes: edit in the UI,
    # export the JSON, commit it. A UI save would be lost on the next start.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
