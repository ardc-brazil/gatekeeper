global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: gatekeeper
    static_configs:
      - targets: ["datamap_gatekeeper:9095"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["datamap_loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["datamap_alloy:12345"]
