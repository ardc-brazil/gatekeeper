global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: gatekeeper
    static_configs:
      - targets:
          - "datamap_gatekeeper:9095"
          - "datamap_gatekeeper_b:9095"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["datamap_loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["datamap_alloy:12345"]

  # The whole host, which is shared: most of its CPU belongs to a neighbour.
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: datamap-prod

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["datamap_cadvisor:8080"]
    metric_relabel_configs:
      # Other projects' containers are not ours to store.
      - source_labels: [name]
        regex: "datamap_.*"
        action: keep

  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["datamap_postgres_exporter:9187"]

  - job_name: nginx
    scrape_interval: 30s
    static_configs:
      - targets: ["datamap_nginx_exporter:9113"]

  # MINIO_PROMETHEUS_AUTH_TYPE=public: the docker network is the boundary, as
  # for the gatekeeper, and there is no token to expire when credentials rotate.
  - job_name: minio
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["datamap_min_io:9000"]

  - job_name: minio_bucket
    scrape_interval: 60s
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ["datamap_min_io:9000"]

  - job_name: tusd
    static_configs:
      - targets: ["datamap_tusd:1080"]
