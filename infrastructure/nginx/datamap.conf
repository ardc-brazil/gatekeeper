# Two gatekeeper instances.
#
# proxy_connect_timeout, below, is the setting that matters most: when a
# container dies its address stops answering rather than refusing, so the 60s
# default makes nginx wait instead of trying the other one. Measured: 5 failed
# requests without it, 0 with.
#
# fail_timeout is how long an instance stays ejected after a failure, and it
# sets the floor for the rolling deploy: replacing the second instance before
# the first is retried leaves nginx with nowhere to send. See
# docker-deployment-rolling in the Makefile.
upstream gatekeeper {
    server 127.0.0.1:9092 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:9192 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name datamap.pcs.usp.br  www.datamap.pcs.usp.br;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    #server_name datamap.pcs.usp.br www.datamap.pcs.usp.br;

    listen 80;

    ssl_certificate /etc/letsencrypt/live/datamap.pcs.usp.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datamap.pcs.usp.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # gatekeeper
    location /api/v1 {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://gatekeeper;
    }

    # pgadmin
    location /pgadmin {
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Host $host;
        proxy_pass http://localhost:5050;
        proxy_redirect off;
    }

    # gatekeeper api docs
    location /api/openapi.json {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://gatekeeper/api/openapi.json;
    }

    # swaggerui
    location /api/docs {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://gatekeeper/api/docs;
    }

    location /health-check {
        add_header Content-Type text/plain;
        return 200 "success";
    }

    # webapp server
    location /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:3000/api;
    }

    # tusd
    location /files/ {
	# Disable request and response buffering
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_http_version       1.1;

        # Add X-Forwarded-* headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header         Upgrade $http_upgrade;
        proxy_set_header         Connection "upgrade";
        client_max_body_size     0;
	 
	proxy_pass http://localhost:1080;
    }

    # minio console
    location /minio/ui {
        rewrite ^ /minio/ui/ permanent;
    }
    
    location ~ ^/minio/ui/(.*) {
        rewrite ^/minio/ui/(.*) /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;

        # This is necessary to pass the correct IP to be hashed
        real_ip_header X-Real-IP;

        proxy_connect_timeout 300;

        # To support websockets in MinIO versions released after January 2023
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Some environments may encounter CORS errors (Kubernetes + Nginx Ingress)
        # Uncomment the following line to set the Origin request to an empty string
        # proxy_set_header Origin '';

        chunked_transfer_encoding off;
        proxy_pass http://localhost:9001;
    }

    # minio download
    location /datamap {
	proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

	proxy_pass http://localhost:9000;
    }

    # doi redirection
    location ~ ^/doi/datasets/([^/]+)/versions/([^/]+) {
        rewrite ^/doi/datasets/([^/]+)/versions/([^/]+) /app/datasets/$1/versions/$2 permanent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:3000;
    }

    # webapp
    location /app {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:3000/app;
    }

    # datamap - home page
    #location /h {
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_pass http://localhost:3001/h;
    #}

    # root
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:3000;
    }

}
